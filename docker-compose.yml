# Deploy por ambiente — o mesmo compose serve prod (VPS) e staging
# (notebook via tunnel); o que muda é o arquivo de env:
#   docker compose --env-file .env.production up -d --build
# O .env do host carrega tanto a interpolação (${VAR} aqui) quanto o
# env_file do container. Conteúdo = vars do ambiente (ver .env.vercel-*
# arquivados ou `vercel env pull`).
services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_APP_ENV: ${APP_ENV:-production}
    # GHCR no deploy (IMAGE=ghcr.io/...:tag) ou build local sem IMAGE
    image: ${IMAGE:-realiza-app}
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # substitui o cron da vercel.json — mesmo horário (06:00 UTC), mesmo
  # endpoint, mesmo bearer CRON_SECRET
  cron:
    image: alpine:3.21
    env_file: .env
    volumes:
      - ./docker/crontab:/etc/crontabs/root:ro
      - ./docker/cron-tick.sh:/cron-tick.sh:ro
    command: ["crond", "-f", "-l", "6"]
    depends_on:
      - app
    restart: unless-stopped
    mem_limit: 64m
