name: e2e-preview

# E2E no preview do Vercel assim que o deploy fica Ready.
# Specs demo sempre rodam (superfície pública, writes stubados). Specs "app"
# (login real + writes) rodam quando os secrets E2E_* existem — e precisam
# apontar pro projeto SUPABASE DE STAGING, nunca prod: o app do preview usa
# as env vars do escopo Preview, que apontam pra staging. helpers.ts tem um
# hard-stop que recusa rodar se a URL contiver o ref de produção.
on:
  deployment_status:

# As fixtures e2e00000-*/de* são GLOBAIS no staging e divididas com o
# e2e-app (push/PR/nightly — app buildado no runner contra o mesmo backend):
# dois runs e2e concorrentes — de qualquer workflow — apagam a fixture um do
# outro (flake garantido). O grupo `e2e-staging` é repo-wide e compartilhado
# com e2e-app.yml: TODA a suite serializa numa fila única; run novo espera o
# atual terminar. O deployment órfão "Preview – realiza" da Vercel entra na
# mesma fila e morre no `if` do job em segundos — o sufixo de environment
# que o isolava não é mais preciso.
# Sem cancel-in-progress: run cortado no meio deixa fixture em estado
# parcial — commit novo espera, nunca cancela.
concurrency:
  group: e2e-staging
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # a suite passou de 80 specs (~89 hoje) em 1 worker — serial por desenho,
    # os fixtures app compartilham estado no staging. Setup ~2min + suíte
    # ~14min já cruzava 15; 25 dá margem pra crescer sem recisitar.
    timeout-minutes: 25
    # O environment muda com o nº de projetos Vercel no repo: com dois era
    # 'Preview – realiza.vc' (o órfão 'realiza' foi deletado); com um só,
    # Vercel reporta 'Preview' a seco. Aceita os dois — se um segundo
    # projeto voltar a conectar, o nome com sufixo continua casando e o
    # filtro por nome do projeto segue protegendo do órfão.
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Preview' ||
       github.event.deployment.environment == 'Preview – realiza.vc')
    steps:
      # guard primeiro: sem o bypass não adianta checkout/install (~1min)
      - name: bypass de proteção configurado?
        id: check
        env:
          B: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
        run: |
          if [ -z "$B" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS ausente — e2e de preview pulado."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != '1'
        uses: pnpm/action-setup@v4
      - if: steps.check.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.check.outputs.skip != '1'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != '1'
        run: pnpm exec playwright install --with-deps chromium
      # fixtures NÃO são re-seedadas aqui — os pisos dos specs (convergirPiso
      # & cia) re-criam o estado volátil e a base persiste no staging. Re-seed
      # a cada push apagava/recriava rows enquanto a suite lia (derrubava o
      # PostgREST do free tier e gerava flake em massa). Se faltar fixture —
      # ex.: staging recriado — roda `pnpm seed:e2e` manual com .env.staging.
      - if: steps.check.outputs.skip != '1'
        name: playwright (demo + app)
        run: pnpm test:e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_MENTOR_EMAIL: e2e-mentor@realiza.test
          E2E_MENTOR_PASSWORD: e2e-senha-teste
          E2E_DUPLA_ID: e2e00000-0000-4000-8000-000000000030
          E2E_COORD_EMAIL: e2e-coord@realiza.test
          E2E_COORD_PASSWORD: ${{ secrets.E2E_COORD_PASSWORD || 'e2e-senha-teste' }}
          E2E_DUPLA2_ID: e2e00000-0000-4000-8000-000000000070
          # jovem usa a mesma senha do mentor — um secret a menos
          E2E_JOVEM_EMAIL: jovem-e2e@realiza.test
      - if: failure() && steps.check.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
