name: e2e-preview

# Roda os specs DEMO no preview que acabou de ficar Ready — superfície
# pública, writes stubados, zero risco contra o banco de prod que o preview
# usa. Os specs "app" ficam de fora de propósito: o preview não tem backend
# de staging, e secrets E2E_* aqui rodariam contra o supabase deployado
# junto (prod). deployment_status herda o checkout do commit deployado —
# manter o job sem secrets limita o blast radius de código não-confiável.
on:
  deployment_status:

concurrency:
  group: e2e-preview-${{ github.event.deployment.id }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Preview'
    steps:
      # guard primeiro: sem o bypass não adianta checkout/install (~1min)
      - name: bypass de proteção configurado?
        id: check
        env:
          B: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
        run: |
          if [ -z "$B" ]; then
            echo "::notice::VERCEL_AUTOMATION_BYPASS ausente — e2e de preview pulado."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.check.outputs.skip != '1'
        uses: actions/checkout@v4
      - if: steps.check.outputs.skip != '1'
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - if: steps.check.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.check.outputs.skip != '1'
        run: pnpm install --frozen-lockfile
      - if: steps.check.outputs.skip != '1'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.check.outputs.skip != '1'
        name: playwright demo
        run: pnpm test:e2e:demo
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS }}
      - if: failure() && steps.check.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
