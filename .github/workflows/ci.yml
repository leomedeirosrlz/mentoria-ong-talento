name: ci

# roda em todo push — PR nem precisa de trigger próprio: o status cai no
# commit e aparece no PR; `pull_request` a mais duplicaria cada run.
# O e2e do preview é workflow à parte (e2e-preview.yml), disparado pelo
# deployment_status do Vercel.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LayoutProps/PageProps vivem em .next/types (gerado) — sem typegen
      # o tsc falha em checkout limpo
      - run: pnpm exec next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: pnpm test

  # guarda anti-regressão de agente: migrations imutáveis contra a base,
  # segredos, marcadores do AGENTS.md, links de docs, numeração, actionlint.
  # Node puro (sem pnpm install) — ver scripts/repo-guard.mjs.
  repo-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # R1/R9 comparam o HEAD contra a base — histórico completo
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/repo-guard.mjs
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}

  # O contrato compara o código com o ambiente que ele vai encontrar:
  #   - PR/push de feature → staging (onde as migrations já foram aplicadas)
  #   - release (PR para main ou push em main) → produção, que é o schema do deploy
  # Antes todo PR comparava com prod e ficava vermelho enquanto as migrations
  # pendentes não fossem aplicadas — um bloqueio que não era do PR.
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && secrets.SUPABASE_URL || secrets.E2E_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ (github.base_ref == 'main' || github.ref == 'refs/heads/main') && secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: checa tipos × schema remoto
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: node scripts/check-schema-contract.mjs
      - name: secrets ausentes — probe pulado
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::notice::secrets SUPABASE_URL/SERVICE_ROLE ausentes; probe pulado"
