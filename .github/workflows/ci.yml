name: ci

# roda em todo push — PR nem precisa de trigger próprio: o status cai no
# commit e aparece no PR; `pull_request` a mais duplicaria cada run.
# O e2e do preview é workflow à parte (e2e-preview.yml), disparado pelo
# deployment_status do Vercel.
on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LayoutProps/PageProps vivem em .next/types (gerado) — sem typegen
      # o tsc falha em checkout limpo
      - run: pnpm exec next typegen
      - run: npx tsc --noEmit
      - run: npx eslint src/
      - run: pnpm test

  # código não pode mergear pedindo coluna que o remoto não tem — a 0061/0062
  # foi exatamente esse caso. Falha até a migration ser aplicada (gate humano).
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # produção — é o schema que o deploy usa; E2E_* é staging e não vale aqui
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: checa tipos × schema remoto
        if: env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != ''
        run: node scripts/check-schema-contract.mjs
      - name: secrets ausentes — probe pulado
        if: env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == ''
        run: echo "::notice::secrets SUPABASE_URL/SERVICE_ROLE ausentes; probe pulado"
