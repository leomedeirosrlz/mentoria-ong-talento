name: e2e-app

# E2E do app real (login + writes) como GATE do dia a dia: o código do PR
# builda no runner (`pnpm build && pnpm start` em :3000) e roda a suite
# inteira. Não depende de deploy Vercel: imune ao Ignored Build Step.
#
# Backend por gatilho:
#   pull_request / dispatch local (default) → `supabase start` NO RUNNER:
#     migrations + seed.sql + fixtures frescos, gate de freshness dos types.
#     Cada run tem banco próprio → sem fila entre PRs, sem 504 do free tier
#     do staging, e a suite divide em shards paralelos (cada shard sobe o
#     próprio stack — as fixtures e2e00000-* não se cruzam).
#   schedule / dispatch staging → app no runner × Supabase de STAGING via
#     secrets E2E_*. Canário diário do ambiente real; serial e na fila
#     global `e2e-staging` (fixtures globais divididas com o e2e-preview).
#
# Antes (out/2026) o gate rodava contra o staging em push E em PR: dois
# runs por push numa fila única, e staging lento (login → 504) segurava
# cada run até o teto de 70min (runs 40252040155, 40241021023).
#
# `e2e-app / e2e` é required check do main: o job `e2e` agrega os shards
# e FALHA se algum falhou ou foi cancelado — skip contaria como verde.
# No modo staging o guard de secrets também falha com ::error:: em vez
# de skipar.
on:
  pull_request:
  schedule:
    - cron: "0 13 * * *" # 10:00 BRT — uma hora depois do demo-smoke em prod
  workflow_dispatch:
    inputs:
      backend:
        description: "local (default — supabase start no runner, sem secrets) ou staging (app no runner × Supabase staging)"
        type: choice
        options:
          - local
          - staging
        default: local

# Staging: fila única repo-wide (mesmo nome do e2e-preview.yml), sem
# cancel-in-progress — run cortado deixa fixture em estado parcial.
# Local: um run por ref; push novo no PR cancela o anterior (banco é
# descartável).
concurrency:
  group: >-
    ${{ (github.event_name == 'schedule' || inputs.backend == 'staging')
        && 'e2e-staging' || format('e2e-app-{0}', github.ref) }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'schedule' || inputs.backend == 'staging') }}

permissions:
  contents: read

jobs:
  # O modo sai UMA vez daqui; os shards leem o output. Staging exige os 3
  # secrets E2E_* — faltando, FALHA (nunca skip). Segunda trava: a URL não
  # pode conter o ref de prod — specs app escrevem de verdade (defesa em
  # profundidade sobre o hard-stop de tests/e2e/helpers.ts).
  modo:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.modo.outputs.backend }}
      shards: ${{ steps.modo.outputs.shards }}
      total: ${{ steps.modo.outputs.total }}
    steps:
      - name: modo do backend + guard de secrets
        id: modo
        env:
          BACKEND: >-
            ${{ (github.event_name == 'schedule' || inputs.backend == 'staging')
                && 'staging' || 'local' }}
          E2E_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_ANON: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
        run: |
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          if [ "$BACKEND" = "local" ]; then
            echo 'shards=[1,2,3]' >> "$GITHUB_OUTPUT"
            echo "total=3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # staging é um banco só: shards em paralelo se apagariam
          echo 'shards=[1]' >> "$GITHUB_OUTPUT"
          echo "total=1" >> "$GITHUB_OUTPUT"
          falta=""
          if [ -z "$E2E_URL" ]; then falta="$falta E2E_SUPABASE_URL"; fi
          if [ -z "$E2E_KEY" ]; then falta="$falta E2E_SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -z "$E2E_ANON" ]; then falta="$falta E2E_SUPABASE_ANON_KEY"; fi
          if [ -n "$falta" ]; then
            echo "::error::secrets ausentes:$falta — criar apontando pro projeto realiza-staging (ref onkosatlcvircdrfgyzq; o anon key é o mesmo das envs Preview da Vercel). Sem secrets, rode manual com backend=local."
            exit 1
          fi
          if [[ "$E2E_URL" == *yhjzmxleotahijinjepl* ]]; then
            echo "::error::E2E_SUPABASE_URL aponta pra PRODUÇÃO — os specs app fazem writes; o alvo certo é o staging (ref onkosatlcvircdrfgyzq)"
            exit 1
          fi

  shard:
    needs: modo
    runs-on: ubuntu-latest
    # setup (install + supabase start + build) ~5min + 1/3 da suite.
    # Staging roda serial inteiro: teto maior. Regressão de duração é o
    # alarme — e o maxFailures do playwright.config corta backend quebrado.
    timeout-minutes: ${{ needs.modo.outputs.backend == 'local' && 30 || 70 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.modo.outputs.shards) }}
    env:
      BACKEND: ${{ needs.modo.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      # pnpm sai do packageManager do package.json — pinar version aqui
      # conflita ("Multiple versions of pnpm specified")
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ---- modo local: stack supabase inteiro no runner ----
      # CLI pinado pela devDep `supabase` — sem setup-cli@latest derivando.
      # Fora os serviços que a suite não toca (encurta o pull de imagens).
      - if: env.BACKEND == 'local'
        name: supabase local
        run: >-
          pnpm exec supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - if: env.BACKEND == 'local'
        name: capturar envs do supabase local
        # status -o env emite valores COM aspas (API_URL="http://...") e
        # $GITHUB_ENV não desquota — o seed e o fetch quebrariam no URL
        run: |
          pnpm exec supabase status -o env \
            | grep -E '^\w+=".*"$' \
            | sed -E 's/^(\w+)="(.*)"$/\1=\2/' >> "$GITHUB_ENV"
      # gate de freshness: o bloco `public` do types commitado precisa bater
      # com o que as migrations produzem. gen types emite os schemas que o
      # stack local expõe (graphql_public etc.) — --schema não filtra — então
      # compara-se só o bloco public (o mesmo que o contract check lê).
      # Uma vez por run basta: só no shard 1.
      - if: env.BACKEND == 'local' && matrix.shard == 1
        name: types atualizados vs migrations
        run: |
          pnpm exec supabase gen types typescript --db-url "$DB_URL" \
            > /tmp/dbtypes.ts
          node -e '
            const fs = require("fs");
            const pub = (f) => {
              const s = fs.readFileSync(f, "utf8");
              const i = s.indexOf("  public: {");
              if (i < 0) { console.error("bloco public não achado em " + f); process.exit(2); }
              let d = 0; const j = s.indexOf("{", i);
              for (let k = j; k < s.length; k++) {
                if (s[k] === "{") d++;
                else if (s[k] === "}" && !--d) return s.slice(j, k + 1);
              }
              process.exit(2);
            };
            fs.writeFileSync("/tmp/pub-new.ts", pub("/tmp/dbtypes.ts"));
            fs.writeFileSync("/tmp/pub-old.ts", pub("src/lib/database.types.ts"));
          '
          if ! diff -q /tmp/pub-new.ts /tmp/pub-old.ts >/dev/null; then
            echo "::error::database.types.ts diverge das migrations — regenere: supabase gen types typescript --linked"
            diff /tmp/pub-new.ts /tmp/pub-old.ts | head -40
            exit 1
          fi
      # ---- build do código sob teste; backend conforme o modo ----
      # NEXT_PUBLIC_* são embutidas no bundle no build: no modo local vêm do
      # $GITHUB_ENV capturado acima; no staging, dos secrets E2E_*.
      - name: build + start
        run: |
          pnpm build
          nohup pnpm start > /tmp/app.log 2>&1 &
          npx wait-on http://localhost:3000/login -t 120000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.API_URL || secrets.E2E_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.ANON_KEY || secrets.E2E_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_IA_BOLHA: "1"
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY || secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: re_placeholder
          EMAIL_FROM: noreply@realiza.vc
      - name: playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      # Fixtures só no modo local (stack nasce zerada): as do e2e e o
      # dataset demo, igual ao e2e local do dia a dia. No STAGING o seed é
      # manual (`pnpm seed:e2e` com .env.staging): re-seed a cada run
      # derrubava o PostgREST do free tier — os pisos convergirPiso dos
      # specs re-criam o estado volátil (mesma decisão do e2e-preview.yml).
      - if: env.BACKEND == 'local'
        name: fixtures e2e + demo
        run: |
          node scripts/seed-e2e-staging.mjs
          node scripts/seed-demo-staging.mjs
        env:
          E2E_SUPABASE_URL: ${{ env.API_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          E2E_MENTOR_PASSWORD: e2e-senha-teste
          # secret opcional — sem ele o seed cai na senha do mentor
          E2E_COORD_PASSWORD: ${{ secrets.E2E_COORD_PASSWORD || 'e2e-senha-teste' }}
      - name: playwright (demo + app) — shard ${{ matrix.shard }}/${{ needs.modo.outputs.total }}
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ needs.modo.outputs.total }}
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_SUPABASE_URL: ${{ env.API_URL || secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY || secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_MENTOR_EMAIL: e2e-mentor@realiza.test
          E2E_MENTOR_PASSWORD: e2e-senha-teste
          E2E_DUPLA_ID: e2e00000-0000-4000-8000-000000000030
          E2E_COORD_EMAIL: e2e-coord@realiza.test
          E2E_COORD_PASSWORD: ${{ secrets.E2E_COORD_PASSWORD || 'e2e-senha-teste' }}
          E2E_DUPLA2_ID: e2e00000-0000-4000-8000-000000000070
          # jovem usa a mesma senha do mentor — um secret a menos
          E2E_JOVEM_EMAIL: jovem-e2e@realiza.test
      # em falha: report html + test-results (é lá que moram os traces — o
      # que debugga flake no trace.playwright.dev)
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/

  # Nome estável pro required check (`e2e-app / e2e`), independente de
  # quantos shards rodaram. always() + checagem explícita: shard falho ou
  # cancelado deixa este job vermelho, nunca skipped.
  e2e:
    needs: [modo, shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: todos os shards verdes
        env:
          MODO: ${{ needs.modo.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          echo "modo=$MODO shards=$SHARDS"
          [ "$MODO" = "success" ] && [ "$SHARDS" = "success" ]
