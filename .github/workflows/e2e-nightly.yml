name: e2e-nightly

# Demo smoke contra PRODUÇÃO — /demo é pública e não escreve nada; pega
# regressão mesmo em dia sem push. Sem secrets.
on:
  schedule:
    # semanal (segunda 09:00 BRT): cota de CPU da Vercel no limite — cada
    # run é a suíte demo inteira contra produção. Rodar à mão quando quiser
    - cron: "0 12 * * 1"
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://realizavc.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:demo
