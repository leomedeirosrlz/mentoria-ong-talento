<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a70"/>
    </marker>
  </defs>

  <!-- hierarchy chain -->
  <rect x="24" y="16" width="200" height="48" rx="4" fill="#faf9f4" stroke="#a8a698" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="124" y="37" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" fill="#2b2a26">programas</text>
  <text x="124" y="52" text-anchor="middle" font-size="8" fill="#8a887f">Mentoria Profissional, DPP…</text>
  <line x1="124" y1="66" x2="124" y2="96" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>
  <rect x="24" y="100" width="200" height="48" rx="4" fill="#ffffff" stroke="#3a392f" stroke-width="1.2"/>
  <text x="124" y="121" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" fill="#2b2a26">turmas</text>
  <text x="124" y="136" text-anchor="middle" font-size="8" fill="#8a887f">1 · AGO/2026, 2 · SET/2026</text>
  <line x1="124" y1="150" x2="124" y2="180" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>
  <rect x="24" y="184" width="200" height="52" rx="4" fill="hsl(78 56% 53% / 0.12)" stroke="hsl(78 58% 38%)" stroke-width="1.6"/>
  <text x="124" y="205" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11" font-weight="bold" fill="#2b2a26">cronogramas</text>
  <text x="124" y="220" text-anchor="middle" font-size="8" fill="#5c5b52">nº encontros, datas, instrumentos</text>
  <line x1="124" y1="238" x2="124" y2="268" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>
  <rect x="24" y="272" width="200" height="44" rx="4" fill="#faf9f4" stroke="#a8a698" stroke-width="1"/>
  <text x="124" y="290" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10" font-weight="bold" fill="#2b2a26">ciclo_eventos</text>
  <text x="124" y="304" text-anchor="middle" font-size="7.5" fill="#8a887f">datas passam a pertencer ao cronograma</text>

  <!-- duplas -->
  <rect x="310" y="120" width="240" height="216" rx="4" fill="hsl(78 56% 53% / 0.10)" stroke="hsl(78 58% 38%)" stroke-width="1.6"/>
  <text x="430" y="140" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#2b2a26">duplas</text>
  <text x="430" y="154" text-anchor="middle" font-size="8.5" fill="#5c5b52">pertence à turma e segue um cronograma</text>
  <line x1="322" y1="162" x2="538" y2="162" stroke="#c4c2b2"/>
  <text x="322" y="177" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">turma_id</text><text x="538" y="177" text-anchor="end" font-size="8" fill="#6b6a60">→ turmas</text>
  <text x="322" y="200" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">cronograma_id</text><text x="538" y="200" text-anchor="end" font-size="8" fill="#6b6a60">→ cronogramas</text>
  <text x="322" y="223" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">mentor_id</text><text x="538" y="223" text-anchor="end" font-size="8" fill="#6b6a60">→ profiles</text>
  <text x="322" y="246" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">mentorado_id</text><text x="538" y="246" text-anchor="end" font-size="8" fill="#6b6a60">→ mentorados</text>
  <text x="322" y="269" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">supervisor_id</text><text x="538" y="269" text-anchor="end" font-size="8" fill="#6b6a60">→ auxiliar executivo</text>
  <text x="322" y="292" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">trilha</text><text x="538" y="292" text-anchor="end" font-size="8" fill="#6b6a60">dpp | especialista</text>
  <text x="322" y="315" font-family="DejaVu Sans Mono" font-size="8.5" fill="#2b2a26">status</text><text x="538" y="315" text-anchor="end" font-size="8" fill="#6b6a60">ativa | pausada | encerrada</text>

  <!-- elbow connectors duplas -> hierarchy -->
  <polyline points="310,170 260,170 260,124 228,124" fill="none" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>
  <polyline points="310,190 278,190 278,210 228,210" fill="none" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>

  <!-- profiles / mentorados -->
  <rect x="586" y="60" width="120" height="128" rx="4" fill="#ffffff" stroke="#3a392f" stroke-width="1.2"/>
  <text x="646" y="80" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="bold" fill="#2b2a26">profiles</text>
  <text x="646" y="93" text-anchor="middle" font-size="8" fill="#8a887f">com login</text>
  <line x1="596" y1="100" x2="696" y2="100" stroke="#d9d7cc"/>
  <text x="646" y="118" text-anchor="middle" font-size="8" fill="#4a493f">coordenacao</text>
  <text x="646" y="136" text-anchor="middle" font-size="8" fill="#4a493f">auxiliar executivo</text>
  <text x="646" y="154" text-anchor="middle" font-size="8" fill="#4a493f">mentor_dpp</text>
  <text x="646" y="172" text-anchor="middle" font-size="8" fill="#4a493f">mentor_especialista</text>
  <rect x="586" y="216" width="120" height="76" rx="4" fill="#ffffff" stroke="#3a392f" stroke-width="1.2"/>
  <text x="646" y="236" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="10.5" font-weight="bold" fill="#2b2a26">mentorados</text>
  <text x="646" y="249" text-anchor="middle" font-size="8" fill="#8a887f">sem login</text>
  <text x="646" y="268" text-anchor="middle" font-size="8" fill="#4a493f">links tokenizados</text>

  <polyline points="586,120 560,120 560,215 554,215" fill="none" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>
  <polyline points="586,150 570,150 570,262 554,262" fill="none" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>
  <line x1="586" y1="254" x2="554" y2="245" stroke="#7a7a70" stroke-width="1.1" marker-end="url(#ar2)"/>

  <!-- papel por contexto note -->
  <rect x="24" y="356" width="200" height="60" rx="4" fill="#f6f5ee" stroke="#b9b7a8"/>
  <text x="124" y="376" text-anchor="middle" font-size="9" font-weight="bold" fill="#2b2a26">papel por contexto</text>
  <text x="124" y="391" text-anchor="middle" font-size="7.5" fill="#6b6a60">a mesma pessoa pode ser coord</text>
  <text x="124" y="403" text-anchor="middle" font-size="7.5" fill="#6b6a60">num programa e mentor noutro</text>

  <!-- children -->
  <rect x="24" y="470" width="128" height="50" rx="4" fill="#f6f5ee" stroke="#b9b7a8"/>
  <text x="88" y="490" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#2b2a26">encontros</text>
  <rect x="164" y="470" width="128" height="50" rx="4" fill="#f6f5ee" stroke="#b9b7a8"/>
  <text x="228" y="490" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#2b2a26">registros</text>
  <rect x="304" y="470" width="128" height="50" rx="4" fill="#f6f5ee" stroke="#b9b7a8"/>
  <text x="368" y="490" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#2b2a26">encaminham.</text>
  <rect x="444" y="470" width="128" height="50" rx="4" fill="#f6f5ee" stroke="#b9b7a8"/>
  <text x="508" y="490" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#2b2a26">encerramentos</text>
  <rect x="584" y="470" width="122" height="50" rx="4" fill="#f6f5ee" stroke="#b9b7a8"/>
  <text x="645" y="490" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="9.5" fill="#2b2a26">notas e anexos</text>

  <line x1="360" y1="338" x2="92" y2="466" stroke="#b9b7a8" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="392" y1="338" x2="230" y2="466" stroke="#b9b7a8" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="420" y1="338" x2="368" y2="466" stroke="#b9b7a8" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="452" y1="338" x2="506" y2="466" stroke="#b9b7a8" stroke-width="1" marker-end="url(#ar2)"/>
  <line x1="484" y1="338" x2="642" y2="466" stroke="#b9b7a8" stroke-width="1" marker-end="url(#ar2)"/>
</svg>