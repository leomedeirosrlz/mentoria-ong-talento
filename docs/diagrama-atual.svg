<svg viewBox="0 0 720 540" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a7a70"/>
    </marker>
  </defs>

  <!-- ciclo_eventos -->
  <rect x="235" y="12" width="250" height="66" rx="4" fill="#faf9f4" stroke="#a8a698" stroke-width="1" stroke-dasharray="5 3"/>
  <text x="360" y="34" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#2b2a26">ciclo_eventos</text>
  <text x="360" y="50" text-anchor="middle" font-size="9" fill="#4a493f">16 encontros + formações oficiais</text>
  <text x="360" y="64" text-anchor="middle" font-size="8.5" fill="#8a887f">chave de texto: ciclo = "2026/2027"</text>

  <!-- profiles -->
  <rect x="14" y="150" width="212" height="196" rx="4" fill="#ffffff" stroke="#3a392f" stroke-width="1.2"/>
  <text x="120" y="170" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#2b2a26">profiles</text>
  <text x="120" y="184" text-anchor="middle" font-size="8.5" fill="#8a887f">pessoas com login</text>
  <line x1="26" y1="192" x2="214" y2="192" stroke="#d9d7cc"/>
  <text x="26" y="207" font-family="DejaVu Sans Mono" font-size="9" fill="#4a5b12">coordenacao</text>
  <text x="26" y="219" font-size="8" fill="#6b6a60">vê e administra tudo</text>
  <text x="26" y="240" font-family="DejaVu Sans Mono" font-size="9" fill="#4a5b12">supervisor</text>
  <text x="26" y="252" font-size="8" fill="#6b6a60">auxiliar executivo: conjunto de duplas</text>
  <text x="26" y="273" font-family="DejaVu Sans Mono" font-size="9" fill="#4a5b12">mentor_dpp</text>
  <text x="26" y="285" font-size="8" fill="#6b6a60">escreve só na própria dupla</text>
  <text x="26" y="306" font-family="DejaVu Sans Mono" font-size="9" fill="#4a5b12">mentor_especialista</text>
  <text x="26" y="318" font-size="8" fill="#6b6a60">trilha curta por solicitação</text>

  <!-- mentorados -->
  <rect x="500" y="150" width="206" height="92" rx="4" fill="#ffffff" stroke="#3a392f" stroke-width="1.2"/>
  <text x="603" y="170" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="11.5" font-weight="bold" fill="#2b2a26">mentorados</text>
  <text x="603" y="184" text-anchor="middle" font-size="8.5" fill="#8a887f">sem login</text>
