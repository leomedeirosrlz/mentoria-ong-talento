<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560">
  <defs>
    <marker id="darr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8" fill="none" stroke="#262626" stroke-width="1.3" />
    </marker>
  </defs>

  <rect width="1240" height="560" fill="#f1f2ec" />
  <rect x="14" y="14" width="1212" height="532" rx="10" fill="none" stroke="#262626" stroke-opacity="0.16" stroke-width="1.25" />

  <!-- header -->
  <text x="48" y="58" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="22" font-weight="700" fill="#262626">Mapa do sistema</text>
  <text x="1192" y="58" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#565950">rls via my_role() / my_profile_id()</text>

  <!-- ===== pipeline da dupla ===== -->
  <g fill="none" stroke="#262626" stroke-opacity="0.45" stroke-width="1.25">
    <path d="M230 134 L258 134" marker-end="url(#darr)" />
    <path d="M448 134 L476 134" marker-end="url(#darr)" />
    <path d="M671 134 L699 134" marker-end="url(#darr)" />
    <path d="M989 134 L1017 134" marker-end="url(#darr)" />
  </g>
  <circle r="3" fill="#4e6318"><animateMotion dur="1.9s" repeatCount="indefinite" path="M230 134 L258 134" /></circle>
  <circle r="3" fill="#4e6318"><animateMotion dur="1.9s" begin="0.5s" repeatCount="indefinite" path="M448 134 L476 134" /></circle>
  <circle r="3" fill="#4e6318"><animateMotion dur="1.9s" begin="1s" repeatCount="indefinite" path="M671 134 L699 134" /></circle>
  <circle r="3" fill="#4e6318"><animateMotion dur="1.9s" begin="1.5s" repeatCount="indefinite" path="M989 134 L1017 134" /></circle>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3a3c36">
    <!-- 1 intake -->
    <rect x="48" y="82" width="182" height="104" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
    <text x="64" y="110" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">1 &#183; intake</text>
    <text x="64" y="140">coord cadastra</text>
    <text x="64" y="158">as pessoas antes;</text>
    <text x="64" y="176">login por allowlist</text>

    <!-- 2 matching -->
    <rect x="258" y="82" width="190" height="104" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
    <text x="274" y="110" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">2 &#183; matching</text>
    <text x="274" y="140">grade de hor&#225;rios</text>
    <text x="274" y="158">afinidade dos lados</text>
    <text x="274" y="176">&lt;18 pede respons&#225;vel</text>

    <!-- 3 dupla -->
    <rect x="476" y="82" width="195" height="104" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
    <text x="492" y="110" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">3 &#183; dupla</text>
    <circle cx="500" cy="136" r="8" fill="#a2ca44" />
    <circle cx="514" cy="136" r="8" fill="#ffd531" fill-opacity="0.92" />
    <text x="528" y="140">mentor+mentorado</text>
    <text x="492" y="162">ativa &#183; pausada</text>
    <text x="492" y="180">conclu&#237;da/encerrada</text>

    <!-- 4 jornada -->
    <rect x="699" y="82" width="290" height="104" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
    <text x="715" y="110" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">4 &#183; jornada</text>
    <text x="715" y="134">16 encontros oficiais &#183; ter&#231;as</text>
    <g>
      <line x1="719" y1="150" x2="951" y2="150" stroke="#262626" stroke-opacity="0.2" stroke-width="1" />
      <circle cx="719" cy="150" r="4.5" fill="#a2ca44" /><circle cx="734.5" cy="150" r="4.5" fill="#a2ca44" /><circle cx="750" cy="150" r="4.5" fill="#a2ca44" />
      <circle cx="765.5" cy="150" r="4.5" fill="#a2ca44" /><circle cx="781" cy="150" r="4.5" fill="#a2ca44" /><circle cx="796.5" cy="150" r="4.5" fill="#a2ca44" />
      <circle cx="812" cy="150" r="4.5" fill="#a2ca44" /><circle cx="827.5" cy="150" r="4.5" fill="#a2ca44" />
      <circle cx="843" cy="150" r="4.5" fill="#ffd531" /><circle cx="858.5" cy="150" r="4.5" fill="#ffd531" />
      <circle cx="874" cy="150" r="4.5" fill="none" stroke="#565950" stroke-width="1" stroke-dasharray="2 2" />
      <circle cx="889.5" cy="150" r="4.5" fill="none" stroke="#262626" stroke-opacity="0.55" stroke-width="1.2" />
      <circle cx="905" cy="150" r="4.5" fill="none" stroke="#262626" stroke-opacity="0.28" stroke-width="1" />
      <circle cx="920.5" cy="150" r="4.5" fill="none" stroke="#262626" stroke-opacity="0.28" stroke-width="1" />
      <circle cx="936" cy="150" r="4.5" fill="none" stroke="#262626" stroke-opacity="0.28" stroke-width="1" />
      <circle cx="951" cy="150" r="4.5" fill="none" stroke="#262626" stroke-opacity="0.28" stroke-width="1" />
    </g>
    <text x="715" y="176">realizado &#8594; registro do mentor</text>

    <!-- 5 encerramento -->
    <rect x="1017" y="82" width="172" height="104" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
    <text x="1033" y="110" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">5 &#183; fechamento</text>
    <text x="1033" y="140">checklist do rito</text>
    <text x="1033" y="158">autoavalia&#231;&#227;o rpc</text>
    <text x="1033" y="176">resumo da jornada</text>
  </g>

  <!-- ===== semáforo ===== -->
  <rect x="48" y="206" width="628" height="176" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
  <text x="64" y="234" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">Sem&#225;foro: sa&#250;de da dupla</text>
  <text x="660" y="234" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#565950">saudadeDaDupla() &#183; o 1&#186; sinal que bate vence</text>

  <circle cx="74" cy="260" r="7" fill="#dc1818" />
  <text x="90" y="265" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">risco</text>
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3a3c36">
    <circle cx="94" cy="279" r="2.5" fill="#dc1818" />
    <text x="106" y="283">pedido de apoio no registro</text>
    <circle cx="94" cy="299" r="2.5" fill="#dc1818" />
    <text x="106" y="303">avalia&#231;&#227;o baixa + dificuldade</text>
    <circle cx="94" cy="319" r="2.5" fill="#dc1818" />
    <text x="106" y="323">2+ encontros atrasados</text>
  </g>

  <circle cx="370" cy="260" r="7" fill="#db9e06" />
  <text x="386" y="265" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">aten&#231;&#227;o</text>
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3a3c36">
    <circle cx="396" cy="279" r="2.5" fill="#d9a800" />
    <text x="408" y="283">1 atraso ou baixa/dificuldade</text>
    <circle cx="396" cy="299" r="2.5" fill="#d9a800" />
    <text x="408" y="303">&#8804;5d p/ oficial sem agendar</text>
    <circle cx="396" cy="319" r="2.5" fill="#d9a800" />
    <text x="408" y="323">registro pendente &gt;24h ou limbo</text>
    <circle cx="396" cy="339" r="2.5" fill="#d9a800" />
    <text x="408" y="343">combinado com prazo vencido</text>
  </g>

  <text x="64" y="368" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#565950">sem sinal &#8594; ok &#183; pausada ou conclu&#237;da congela &#183; especialista n&#227;o atrasa</text>

  <!-- ===== estados do encontro ===== -->
  <rect x="700" y="206" width="492" height="176" rx="8" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
  <text x="716" y="234" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="15" font-weight="700" fill="#262626">Estados de um encontro</text>
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#3a3c36">
    <circle cx="728" cy="256" r="6" fill="#a2ca44" />
    <text x="744" y="260">realizado + registro</text>
    <circle cx="728" cy="278" r="6" fill="#ffd531" />
    <text x="744" y="282">realizado, falta o registro</text>
    <circle cx="728" cy="300" r="6" fill="none" stroke="#565950" stroke-width="1.2" stroke-dasharray="2 2" />
    <text x="744" y="304">limbo: agendado e j&#225; passou</text>
    <circle cx="728" cy="322" r="6" fill="none" stroke="#262626" stroke-opacity="0.55" stroke-width="1.2" />
    <text x="744" y="326">agendado</text>
    <circle cx="728" cy="344" r="6" fill="#565950" fill-opacity="0.3" />
    <text x="744" y="348">n&#227;o aconteceu / cancelado</text>
    <circle cx="728" cy="366" r="6" fill="none" stroke="#262626" stroke-opacity="0.28" stroke-width="1" />
    <text x="744" y="370">futuro</text>
  </g>

  <!-- ===== escopo RLS ===== -->
  <rect x="48" y="404" width="1144" height="96" rx="8" fill="none" stroke="#262626" stroke-opacity="0.3" stroke-width="1.25" stroke-dasharray="8 5" />
  <text x="68" y="430" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14" letter-spacing="2" fill="#4e6318">RLS &#183; ESCOPO POR PAPEL</text>
  <g font-family="'JetBrains Mono','Fira Code',monospace">
    <rect x="68" y="444" width="205" height="44" rx="6" fill="#ffffff" stroke="#262626" stroke-opacity="0.2" />
    <text x="82" y="464" font-size="14" font-weight="700" fill="#262626">coordena&#231;&#227;o</text>
    <text x="82" y="481" font-size="13" fill="#565950">acesso total</text>

    <rect x="293" y="444" width="205" height="44" rx="6" fill="#ffffff" stroke="#262626" stroke-opacity="0.2" />
    <text x="307" y="464" font-size="14" font-weight="700" fill="#262626">supervisor</text>
    <text x="307" y="481" font-size="13" fill="#565950">duplas supervisionadas</text>

    <rect x="518" y="444" width="205" height="44" rx="6" fill="#ffffff" stroke="#262626" stroke-opacity="0.2" />
    <text x="532" y="464" font-size="14" font-weight="700" fill="#262626">mentor_dpp</text>
    <text x="532" y="481" font-size="13" fill="#565950">s&#243; a pr&#243;pria dupla</text>

    <rect x="743" y="444" width="205" height="44" rx="6" fill="#ffffff" stroke="#262626" stroke-opacity="0.2" />
    <text x="757" y="464" font-size="14" font-weight="700" fill="#262626">especialista</text>
    <text x="757" y="481" font-size="13" fill="#565950">trilha de 5 encontros</text>

    <rect x="968" y="444" width="205" height="44" rx="6" fill="#ffffff" stroke="#262626" stroke-opacity="0.2" />
    <text x="982" y="464" font-size="14" font-weight="700" fill="#262626">p&#250;blico</text>
    <text x="982" y="481" font-size="13" fill="#565950">demo &#183; forms &#183; assinar</text>
  </g>

  <!-- rodapé -->
  <text x="48" y="532" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#565950">vocabul&#225;rio dos guias do programa: dupla &#183; encontro &#183; registro &#183; encaminhamento</text>
  <text x="1192" y="532" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="13" fill="#565950">postgres + auth + storage &#183; 54 migrations</text>
</svg>
