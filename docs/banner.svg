    <text x="392.8" y="166">01</text><text x="422.8" y="166">02</text><text x="452.8" y="166">03</text><text x="482.8" y="166">04</text>
    <text x="512.8" y="166">05</text><text x="542.8" y="166">06</text><text x="572.8" y="166">07</text><text x="602.8" y="166">08</text>
