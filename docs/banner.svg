  <circle r="6" fill="#a2ca44" stroke="#262626" stroke-width="1.5">
    <animateMotion dur="5.5s" repeatCount="indefinite" path="M392 162 L842 162" />
  </circle>

  <!-- direita: card do semáforo -->
  <rect x="868" y="62" width="184" height="174" rx="12" fill="#ffffff" stroke="#262626" stroke-opacity="0.22" stroke-width="1.25" />
  <text x="884" y="90" font-family="'Mitr','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14.5" font-weight="700" fill="#262626">sa&#250;de da dupla</text>
  <text x="884" y="104" font-family="'JetBrains Mono','Fira Code',monospace" font-size="9.5" fill="#565950">saudadeDaDupla()</text>

  <!-- indicador que pisca entre estados -->
  <rect x="876" y="118" width="5" height="24" rx="2.5" fill="#262626">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 36;0 72" keyTimes="0;0.34;0.67" calcMode="discrete" dur="7.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.35;1" dur="1.1s" repeatCount="indefinite" />
  </rect>

  <circle cx="902" cy="130" r="13.5" fill="#a2ca44" />
  <circle cx="902" cy="166" r="13.5" fill="#ffd531" />
  <circle cx="902" cy="202" r="13.5" fill="#e04f3f" />

  <g font-family="'Mitr','Segoe UI',system-ui,-apple-system,sans-serif" font-size="13" fill="#262626">
