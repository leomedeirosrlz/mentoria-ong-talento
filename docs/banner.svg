  <text x="884" y="226" font-family="'JetBrains Mono','Fira Code',monospace" font-size="9.5" fill="#565950">derivada dos sinais</text>

  <!-- rodapé -->
  <line x1="56" y1="252" x2="1044" y2="252" stroke="#262626" stroke-opacity="0.12" stroke-width="1" />
  <text x="56" y="272" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#565950">next.js 16 &#183; react 19 &#183; supabase rls &#183; 54 migrations</text>
  <text x="1044" y="272" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#565950">demo p&#250;blica em /demo &#183; vitest: 156 testes</text>
