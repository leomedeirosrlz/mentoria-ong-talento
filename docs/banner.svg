<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320">
  <rect width="880" height="320" fill="#f1f2ec"/>
  <rect x="0.5" y="0.5" width="879" height="319" fill="none" stroke="#262626" stroke-opacity="0.15"/>

  <!-- header -->
  <text x="48" y="62" font-family="'Mitr','Segoe UI',system-ui,sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#262626">REALIZA<tspan fill="#ffd531">.</tspan><tspan fill="#a2ca44">VC</tspan></text>
  <text x="832" y="52" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#565950">PAINEL OPERACIONAL</text>
  <text x="832" y="70" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="12" letter-spacing="2" fill="#565950">RBAC · RLS · RPC</text>
  <line x1="48" y1="82" x2="832" y2="82" stroke="#262626" stroke-opacity="0.15"/>

  <!-- feature grid: 2 rows × 3 cols -->
  <!-- 1 · board de matching -->
  <g>
    <rect x="48" y="96" width="248" height="86" rx="10" fill="#ffffff" stroke="#262626" stroke-opacity="0.15"/>
    <circle cx="74" cy="118" r="8" fill="#a2ca44"/>
    <circle cx="89" cy="118" r="8" fill="none" stroke="#db9e06" stroke-width="2.5">
      <animate attributeName="r" values="8;11;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="108" y="123" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#262626">board de matching</text>
    <text x="64" y="150" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">grade de horários · afinidade</text>
    <text x="64" y="169" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">ativa/pausa/encerra a dupla</text>
  </g>

  <!-- 2 · registros -->
  <g>
    <rect x="316" y="96" width="248" height="86" rx="10" fill="#ffffff" stroke="#262626" stroke-opacity="0.15"/>
    <rect x="334" y="106" width="22" height="28" rx="3" fill="none" stroke="#779929" stroke-width="2"/>
    <line x1="339" y1="113" x2="351" y2="113" stroke="#779929" stroke-width="2"/>
    <line x1="339" y1="119" x2="351" y2="119" stroke="#779929" stroke-width="2"/>
    <line x1="339" y1="125" x2="348" y2="125" stroke="#779929" stroke-width="2"/>
    <text x="368" y="123" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#262626">acompanhamento</text>
    <text x="332" y="150" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">registro por encontro · +24h</text>
    <text x="332" y="169" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">sem registro → limbo</text>
  </g>

  <!-- 3 · semáforo -->
  <g>
    <rect x="584" y="96" width="248" height="86" rx="10" fill="#ffffff" stroke="#262626" stroke-opacity="0.15"/>
    <circle cx="606" cy="118" r="6" fill="#779929">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="622" cy="118" r="6" fill="#db9e06">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="638" cy="118" r="6" fill="#dc1818">
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="656" y="123" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#262626">semáforo</text>
    <text x="600" y="150" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">saudadeDaDupla() · recalcula</text>
    <text x="600" y="169" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">a cada leitura · 5 sinais</text>
  </g>

  <!-- 4 · assinaturas & forms -->
  <g>
    <rect x="48" y="194" width="248" height="86" rx="10" fill="#ffffff" stroke="#262626" stroke-opacity="0.15"/>
    <path d="M 66 222 Q 72 210 78 218 Q 84 226 90 216 Q 96 208 102 217" fill="none" stroke="#dc1818" stroke-width="2" stroke-linecap="round" stroke-dasharray="60" stroke-dashoffset="60">
      <animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;0.4;0.8;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="118" y="123" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#262626" transform="translate(0,100)">assinaturas &amp; forms</text>
    <text x="64" y="250" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">/assinar/[token] · /f/[token]</text>
    <text x="64" y="269" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">termos e forms públicos</text>
  </g>

  <!-- 5 · escopo por papel -->
  <g>
    <rect x="316" y="194" width="248" height="86" rx="10" fill="#ffffff" stroke="#262626" stroke-opacity="0.15"/>
    <path d="M 345 208 L 356 213 V 222 Q 356 230 345 234 Q 334 230 334 222 V 213 Z" fill="none" stroke="#a2ca44" stroke-width="2"/>
    <text x="368" y="223" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#262626">escopo por papel</text>
    <text x="332" y="250" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">rls via my_role() · 5 papéis</text>
    <text x="332" y="269" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">coord → supervisor → mentor</text>
  </g>

  <!-- 6 · demo & nudges -->
  <g>
    <rect x="584" y="194" width="248" height="86" rx="10" fill="#ffffff" stroke="#262626" stroke-opacity="0.15"/>
    <circle cx="608" cy="218" r="9" fill="none" stroke="#db9e06" stroke-width="2"/>
    <circle cx="608" cy="218" r="3.5" fill="#db9e06"/>
    <circle cx="608" cy="218" r="9" fill="none" stroke="#db9e06" stroke-width="1.5">
      <animate attributeName="r" values="9;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="628" y="223" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="15" font-weight="700" fill="#262626">/demo &amp; nudges</text>
    <text x="600" y="250" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">modo sem login · lembretes</text>
    <text x="600" y="269" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="13" fill="#565950">de risco via wa.me</text>
  </g>

  <!-- footer -->
  <line x1="48" y1="296" x2="832" y2="296" stroke="#262626" stroke-opacity="0.15"/>
  <text x="48" y="312" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11.5" letter-spacing="1" fill="#565950">next.js 16.3 · react 19 · supabase · 54 migrations · 156 testes</text>
  <text x="832" y="312" text-anchor="end" font-family="ui-monospace,'JetBrains Mono',monospace" font-size="11.5" letter-spacing="1" fill="#565950">programa de mentoria social</text>
</svg>
