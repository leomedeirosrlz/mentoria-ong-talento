  <!-- esquerda: marca -->
  <text x="56" y="114" font-family="'Mitr','Segoe UI',system-ui,-apple-system,sans-serif" font-size="46" font-weight="700" letter-spacing="0.5" fill="#262626">realiza<tspan fill="#a2ca44">.vc</tspan></text>
  <text x="56" y="142" font-family="'Mitr','Segoe UI',system-ui,-apple-system,sans-serif" font-size="14.5" fill="#262626" fill-opacity="0.85">painel operacional da mentoria social</text>

  <!-- glifo da dupla -->
  <circle cx="70" cy="184" r="13" fill="#a2ca44" />
  <circle cx="92" cy="184" r="13" fill="#ffd531" fill-opacity="0.92" />
  <text x="116" y="180" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#565950">uma dupla por ciclo:</text>
  <text x="116" y="196" font-family="'JetBrains Mono','Fira Code',monospace" font-size="12" fill="#262626">mentor &#8596; mentorado</text>

  <text x="56" y="226" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#565950">a dupla agenda os encontros;</text>
  <text x="56" y="242" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#565950">a coordena&#231;&#227;o acompanha.</text>

