    <circle cx="662" cy="162" r="13.5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.97s" fill="freeze" /></circle>
    <circle cx="692" cy="162" r="13.5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="2.15s" fill="freeze" /></circle>
    <circle cx="722" cy="162" r="13.5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="2.33s" fill="freeze" /></circle>
    <circle cx="752" cy="162" r="13.5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="2.51s" fill="freeze" /></circle>
    <circle cx="782" cy="162" r="13.5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="2.69s" fill="freeze" /></circle>
    <circle cx="812" cy="162" r="13.5" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.45s" begin="2.87s" fill="freeze" /></circle>
