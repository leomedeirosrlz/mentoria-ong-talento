    <circle cx="392" cy="162" r="13.5" /><circle cx="422" cy="162" r="13.5" /><circle cx="452" cy="162" r="13.5" /><circle cx="482" cy="162" r="13.5" />
    <circle cx="512" cy="162" r="13.5" /><circle cx="542" cy="162" r="13.5" /><circle cx="572" cy="162" r="13.5" /><circle cx="602" cy="162" r="13.5" />
