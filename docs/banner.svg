  <text x="525" y="148" font-family="Georgia,serif" font-size="15" font-style="italic" fill="#4a4a42" text-anchor="middle">ciclo da</text>
  <text x="525" y="166" font-family="Georgia,serif" font-size="15" font-style="italic" fill="#4a4a42" text-anchor="middle">dupla</text>

