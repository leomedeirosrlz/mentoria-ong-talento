<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
  <rect width="1100" height="300" fill="#f1f2ec" />
  <rect x="14" y="14" width="1072" height="272" rx="10" fill="none" stroke="#262626" stroke-opacity="0.16" stroke-width="1.25" />

  <!-- meta topo -->
