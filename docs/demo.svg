<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200">
  <rect width="880" height="200" fill="#f1f2ec" />
  <rect x="10" y="10" width="860" height="180" rx="10" fill="none" stroke="#262626" stroke-opacity="0.16" stroke-width="1.25" />

  <!-- esquerda: rota -->
  <text x="48" y="78" font-family="'JetBrains Mono','Fira Code',monospace" font-size="32" font-weight="700" fill="#262626">/demo</text>
  <text x="48" y="104" font-family="'JetBrains Mono','Fira Code',monospace" font-size="11.5" font-weight="700" fill="#4e6318">p&#250;blica, sem login</text>
  <text x="48" y="128" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#565950">a app inteira naveg&#225;vel;</text>
  <text x="48" y="144" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10.5" fill="#565950">muta&#231;&#245;es n&#227;o gravam nada</text>

  <!-- direita: seletor de persona -->
  <text x="310" y="46" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10" letter-spacing="1.5" fill="#565950">PERSONA ATIVA &#183; COOKIE demo_role</text>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="11" fill="#262626" text-anchor="middle">
    <rect x="310" y="56" width="120" height="36" rx="18" fill="#ffffff" stroke="#262626" stroke-opacity="0.25" />
    <text x="370" y="79">coordena&#231;&#227;o</text>
    <rect x="442" y="56" width="120" height="36" rx="18" fill="#ffffff" stroke="#262626" stroke-opacity="0.25" />
    <text x="502" y="79">supervisor</text>
    <rect x="574" y="56" width="120" height="36" rx="18" fill="#ffffff" stroke="#262626" stroke-opacity="0.25" />
    <text x="634" y="79">mentor dpp</text>
    <rect x="706" y="56" width="120" height="36" rx="18" fill="#ffffff" stroke="#262626" stroke-opacity="0.25" />
    <text x="766" y="79">especialista</text>
  </g>

  <!-- seletor que pisca entre personas -->
  <rect x="350" y="100" width="40" height="4" rx="2" fill="#a2ca44">
    <animateTransform attributeName="transform" type="translate" values="0 0;132 0;264 0;396 0" keyTimes="0;0.26;0.51;0.76" calcMode="discrete" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite" />
  </rect>

  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="10" fill="#565950">
    <text x="310" y="128">dataset evergreen: as datas derivam de hoje</text>
    <text x="310" y="146">escopo por papel replicado, como no rls</text>
    <text x="310" y="164">wizard de onboarding por persona</text>
  </g>

  <text x="826" y="164" text-anchor="end" font-family="'JetBrains Mono','Fira Code',monospace" font-size="10" fill="#565950">src/lib/demo/</text>
</svg>
